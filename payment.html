<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Thala 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <div class="logo">
            Thala 7
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-icons">
            <span>⌕</span>
            <a href="cart.html">🛒</a>
            <span>♙</span>
        </div>

    </header>


    <main class="payment-page">

        <div class="payment-left">

            <h1>Checkout</h1>

            <h3>Contact Details</h3>

            <input type="email" placeholder="Email Address">


            <h3>Payment Method</h3>

            <div class="payment-methods">

                <button>Card</button>
                <button>UPI</button>
                <button>Cash</button>

            </div>


            <div class="card-details">

                <input type="text" placeholder="Card Number">

                <div class="card-small-inputs">

                    <input type="text" placeholder="MM / YY">

                    <input type="text" placeholder="CVV">

                </div>

            </div>


            <button class="final-pay">
                Pay Now
            </button>

        </div>


        <div class="payment-right">

            <h2>Order Summary</h2>


            <div class="order-product">

                <img src="images/sneaker-main.png" alt="Sneaker">

                <div>

                    <h3>Seven Premium Sneaker</h3>

                    <p>Size: 8</p>

                    <p>Quantity: 1</p>

                </div>

            </div>


            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹1,334</span>
            </div>

            <div class="summary-row">
                <span>Tax</span>
                <span>₹100</span>
            </div>

            <div class="summary-row">
                <span>Discount</span>
                <span>-₹100</span>
            </div>

            <hr>

            <div class="total-row">
                <span>Total</span>
                <span>₹1,334</span>
            </div>


            <div class="payment-icons">

                <img src="images/google-pay.png" alt="Google Pay">
                <img src="images/razorpay.png" alt="Razorpay">

            </div>

        </div>

    </main>

</body>
</html>

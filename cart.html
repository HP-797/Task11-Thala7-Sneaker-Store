<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Thala 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <div class="logo">
            Thala 7
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-icons">
            <span>⌕</span>
            <a href="cart.html">🛒</a>
            <span>♙</span>
        </div>

    </header>


    <main class="cart-page">

        <h1>Shopping Cart</h1>

        <div class="cart-layout">


            <div class="cart-left">

                <div class="cart-item">

                    <img src="images/sneaker-main.png" alt="Sneaker">

                    <div class="cart-item-details">

                        <h2>Seven Premium Sneaker</h2>

                        <p>Size: 8</p>

                        <p>Quantity: 1</p>

                        <p class="cart-price">₹1,334</p>

                    </div>

                    <div class="remove">
                        ×
                    </div>

                </div>


                <a href="product.html" class="continue-shopping">
                    ← Continue Shopping
                </a>

            </div>


            <div class="cart-right">

                <h2>Order Summary</h2>


                <div class="coupon">

                    <input type="text" placeholder="Coupon Code">

                    <button>Apply</button>

                </div>


                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹1,334</span>
                </div>

                <div class="summary-row">
                    <span>Tax</span>
                    <span>₹100</span>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <span>-₹100</span>
                </div>

                <hr>

                <div class="total-row">
                    <span>Total</span>
                    <span>₹1,334</span>
                </div>


                <a href="payment.html" class="pay-btn">
                    Pay Now
                </a>


                <div class="payment-icons">

                    <img src="images/google-pay.png" alt="Google Pay">
                    <img src="images/razorpay.png" alt="Razorpay">

                </div>

            </div>

        </div>

    </main>

</body>
</html>
